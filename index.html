<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPF Turneringsfinder | Esbjerg Padel Forening</title>
  <meta name="description" content="Find kommende DPF-turneringer efter niveau, række, region, dato, by og center.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div class="eyebrow">Esbjerg Padel Forening</div>
      <h1>DPF Turneringsfinder</h1>
      <p>Find kommende DPF-turneringer samlet ét sted.</p>
    </section>

    <section class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="search" type="search" placeholder="Søg efter turnering, by eller center">
      </div>

      <div class="filters-grid">
        <div class="filter-block">
          <span class="filter-label">Niveau</span>
          <div id="levels" class="chips"></div>
        </div>

        <div class="filter-block">
          <span class="filter-label">Række</span>
          <div id="categories" class="chips"></div>
        </div>

        <div class="filter-block region-block">
          <span class="filter-label">Region</span>
          <div id="regions" class="chips"></div>
        </div>

        <div class="date-filter">
          <label><span>Dato fra</span><input id="dateFrom" type="date"></label>
          <label><span>Dato til</span><input id="dateTo" type="date"></label>
        </div>

        <button id="reset" class="reset-btn" type="button">Nulstil filtre</button>
      </div>
    </section>

    <section class="summary-row">
      <strong id="status">Indlæser turneringer…</strong>
      <span>Data fra Rankedin</span>
    </section>

    <section id="list" class="tournament-list"></section>
    <button id="more" class="more-btn" type="button" hidden>Vis flere</button>
    <footer>DPF Turneringsfinder · Esbjerg Padel Forening</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
