<!-- EPF Turneringsfinder – integreret Holdsport-version -->
<div id="epf-turneringsfinder-wrap" style="width:100%;overflow:hidden;">
  <iframe
    id="epf-turneringsfinder"
    src="https://epf-turneringsfinder.vercel.app/?embed=1"
    title="DPF Turneringsfinder"
    width="100%"
    height="800"
    scrolling="no"
    loading="lazy"
    style="display:block;width:100%;border:0;margin:0;padding:0;background:transparent;overflow:hidden;">
  </iframe>
</div>

<script>
(function () {
  const frame = document.getElementById("epf-turneringsfinder");

  window.addEventListener("message", function (event) {
    if (
      event.data &&
      event.data.type === "EPF_TURNERINGSFINDER_HEIGHT" &&
      Number.isFinite(Number(event.data.height))
    ) {
      frame.style.height = Math.max(500, Number(event.data.height)) + "px";
    }
  });
})();
</script>
