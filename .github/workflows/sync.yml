name: Sync DPF tournaments

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
    - cron: "0 23 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Sync full official DPF organisation calendar
        shell: bash
        env:
          BASE_URL: ${{ secrets.SYNC_BASE_URL }}
        run: |
          set -euo pipefail

          for page in $(seq 0 99); do
            echo "Sync DPF organisation 1420 page $page"

            response=$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 2 --max-time 90 \
              "${BASE_URL}/api/sync?page=${page}&cleanup=1")

            echo "$response"

            has_more=$(RESPONSE="$response" python3 -c \
              'import json,os; print(str(bool(json.loads(os.environ["RESPONSE"]).get("has_more"))).lower())')

            if [ "$has_more" != "true" ]; then
              echo "Hele DPF organisation 1420-kalenderen er synkroniseret."
              break
            fi

            sleep 2
          done
